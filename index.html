<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panorámica 360°</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="pano"></div>

    <div class="toolbar">
        <select id="panoSelect" title="Elegir ubicación"></select>
        <button id="prevBtn" title="Anterior">◀</button>
        <button id="nextBtn" title="Siguiente">▶</button>
        <button id="randomBtn" title="Aleatorio">Aleatorio</button>
        <span class="counter" id="counter"></span>
        <span class="player" id="playerLabel" title="Jugador"></span>
    </div>

    <div id="error"></div>

    <div id="nameOverlay" class="hidden">
        <div class="name-card">
            <h2>Bienvenido</h2>
            <p>Introduce tu nombre de jugador</p>
            <input type="text" id="playerNameInput" placeholder="Tu nombre" maxlength="20" autocomplete="off">
            <button id="saveNameBtn">Entrar</button>
        </div>
    </div>

    <div id="menuOverlay" class="hidden">
        <div class="menu">
            <h1>GG-TLALTE</h1>
            <p class="greeting">Bienvenido, <span id="menuPlayerName"></span>. Elige un modo:</p>
            <div class="modes">
                <div class="mode-card" id="createBtn">
                    <div class="icon">+</div>
                    <h2>Crear sala</h2>
                    <p>Crea una sala y comparte el código con tus amigos.</p>
                </div>
                <div class="mode-card" id="joinBtn">
                    <div class="icon">&rarr;</div>
                    <h2>Unirse a sala</h2>
                    <p>Entra a una sala con un código de invitación.</p>
                </div>
                <div class="mode-card" id="soloBtn">
                    <div class="icon">&blacktriangleright;</div>
                    <h2>Jugar en solitario</h2>
                    <p>Adivina la ubicación por tu cuenta.</p>
                </div>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script src="script.js" defer></script>
</body>
</html>
