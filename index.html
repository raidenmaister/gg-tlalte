<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panorámica 360°</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #pano {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .toolbar {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: rgba(20, 20, 30, 0.85);
            border-radius: 10px;
            backdrop-filter: blur(8px);
            color: #eee;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .toolbar select {
            padding: 7px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #1a1a2e;
            color: #eee;
            font-size: 13px;
            cursor: pointer;
            min-width: 260px;
            max-width: 360px;
        }

        .toolbar button {
            padding: 7px 12px;
            border: none;
            border-radius: 6px;
            background: #e94560;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .toolbar button:hover {
            background: #c73652;
        }

        .toolbar .counter {
            font-size: 12px;
            color: #bbb;
            white-space: nowrap;
        }

        #error {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 30, 0.95);
            padding: 20px 30px;
            border-radius: 10px;
            border: 1px solid #e94560;
            color: #e94560;
            font-size: 14px;
            z-index: 100;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div id="pano"></div>

    <div class="toolbar">
        <select id="panoSelect" title="Elegir ubicación"></select>
        <button id="prevBtn" title="Anterior">◀</button>
        <button id="nextBtn" title="Siguiente">▶</button>
        <button id="randomBtn" title="Aleatorio">Aleatorio</button>
        <span class="counter" id="counter"></span>
    </div>

    <div id="error"></div>

    <script>
        // Pega aquí tu API Key de Google Maps JavaScript API
        // (https://console.cloud.google.com/apis/credentials)
        const API_KEY = '';

        let coordenadas = [];
        let currentIndex = 0;
        let panorama = null;

        function showError(message) {
            const el = document.getElementById('error');
            el.textContent = message;
            el.style.display = 'block';
        }

        function updateCounter() {
            document.getElementById('counter').textContent =
                `${currentIndex + 1} / ${coordenadas.length}`;
        }

        function showPano(index) {
            if (!panorama || !coordenadas.length) return;
            currentIndex = index;
            const coord = coordenadas[index];
            panorama.setPano(coord.pano_id);
            panorama.setPov({ heading: 0, pitch: 0 });
            document.getElementById('panoSelect').value = String(index);
            updateCounter();
        }

        function populateSelect() {
            const select = document.getElementById('panoSelect');
            select.innerHTML = '';
            coordenadas.forEach((coord, index) => {
                const option = document.createElement('option');
                option.value = String(index);
                option.textContent = `${coord.lat.toFixed(6)}, ${coord.lng.toFixed(6)} (${coord.date})`;
                select.appendChild(option);
            });
            select.addEventListener('change', (e) => {
                showPano(parseInt(e.target.value, 10));
            });
        }

        function initMap() {
            panorama = new google.maps.StreetViewPanorama(
                document.getElementById('pano'),
                {
                    pano: coordenadas[0].pano_id,
                    pov: { heading: 0, pitch: 0 },
                    zoom: 1,
                    motionTracking: false,
                    motionTrackingControl: false,
                    fullscreenControl: true,
                    addressControl: false,
                    linksControl: true,
                    enableCloseButton: false,
                    visible: true
                }
            );
            showPano(0);
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentIndex > 0) showPano(currentIndex - 1);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentIndex < coordenadas.length - 1) showPano(currentIndex + 1);
        });

        document.getElementById('randomBtn').addEventListener('click', () => {
            showPano(Math.floor(Math.random() * coordenadas.length));
        });

        async function load() {
            try {
                const response = await fetch('coordenadas_validas.json');
                coordenadas = await response.json();
                if (!coordenadas.length) throw new Error('Sin coordenadas');
                populateSelect();
                await loadGoogleMaps();
            } catch (err) {
                showError('Error al cargar coordenadas_validas.json. Asegúrate de que esté en la misma carpeta.');
            }
        }

        function loadGoogleMaps() {
            return new Promise((resolve, reject) => {
                if (window.google && google.maps) {
                    initMap();
                    resolve();
                    return;
                }
                let key = API_KEY.trim();
                if (!key) {
                    key = prompt('Pega tu Google Maps API Key:');
                }
                if (!key) {
                    showError('Se necesita una API Key de Google Maps para cargar la panorámica.');
                    reject(new Error('Sin API Key'));
                    return;
                }
                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${key}&v=weekly`;
                script.async = true;
                script.onload = () => {
                    try {
                        initMap();
                        resolve();
                    } catch (e) {
                        reject(e);
                    }
                };
                script.onerror = () => {
                    showError('No se pudo cargar la API de Google Maps. Revisa tu API Key.');
                    reject(new Error('API load failed'));
                };
                document.head.appendChild(script);
            });
        }

        load();
    </script>
</body>
</html>
